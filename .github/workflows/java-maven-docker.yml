# =============================================================================
# Переиспользуемый (reusable) workflow: Java (Maven) + Docker-образ в GHCR.
#
# Подключение в репозитории приложения (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: PavlovaAlexandra/ci-templates/.github/workflows/java-maven-docker.yml@main
#       permissions:
#         contents: read
#         packages: write
#
# Джобы:  build ──┐
#                 ├──> package (docker build + push в ghcr.io)
#         test  ──┘
# =============================================================================
name: java-maven-docker

on:
  workflow_call:
    inputs:
      runner:
        description: "Метка раннера: ubuntu-latest (GitHub-hosted) или self-hosted"
        type: string
        default: ubuntu-latest
      java-version:
        type: string
        default: "21"
      working-directory:
        description: "Каталог с pom.xml и Dockerfile относительно корня репозитория"
        type: string
        default: "."
      push-image:
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Maven package
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ inputs.working-directory }}/target/*.jar
          retention-days: 1

  test:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Maven test
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ${{ inputs.working-directory }}/target/surefire-reports/
          retention-days: 7

  package:
    needs: [build, test]
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ inputs.working-directory }}/target
      - name: Compute image name
        # Имя образа в GHCR должно быть в нижнем регистре
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - name: Docker build
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
      - name: Login to GHCR
        if: inputs.push-image
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Docker push
        if: inputs.push-image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
